<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rua Livre — jogo de corrida arcade." />
    <title>Rua Livre</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <p class="eyebrow">CORRIDA ARCADE</p>
        <h1>Rua Livre</h1>
        <p class="instructions">Use as setas para dirigir. Pressione Enter para iniciar.</p>
      </header>

      <section class="canvas-frame" aria-label="Área do jogo">
        <canvas id="game-canvas" width="1280" height="720">
          Seu navegador não suporta canvas. Atualize-o para jogar Rua Livre.
        </canvas>
      </section>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
